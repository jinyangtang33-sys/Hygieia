name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline model and UI tests
        run: npm test
      - name: Mac receiver protocol tests
        run: python -m unittest discover -s mac-bridge -p 'test_*.py'
      - name: Public source audit and OCR integrity
        run: npm run audit:public
      - name: Standalone local API and persistence tests
        run: npm run test:local
